name: preview

# S5 预览环境（README §2 目标态矩阵；2026-10-20 用户裁决全量做）。
# 流程：preflight（CF token 权限）→ ensure（Neon 派生分支 + Hyperdrive）→ 迁移 →
#       构建前端（注入预览 API）→ 部署预览 worker（workers.dev）→ PR 评论预览 URL；
#       PR 关闭 → teardown 全量回收。
# 红线（README §2.3 规则 8/9）：预览 worker 绝不绑生产 Hyperdrive/R2/域名；
#       生产 worker 绝不绑预览资源。断言见 scripts/preview/assert-bindings.py。
#
# 2026-10-20 修复记录：
# - 迁移 job 自取 DSN（db-url.py）：GitHub 会静默丢弃含密码的 job output。
# - 预览库跟生产同库名（neondb）：分支内有多个库时的选库修正（ensure/db-url）。
# - Set worker secrets 不用 toJSON(secrets)：逐项显式注入（免审批门禁 + 最小暴露）。

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "伪 PR 号（数字，用于派生 slug/分支名；演示/排障用）"
        required: true
        type: string
      no_kv:
        description: "实验：渲染不带 KV 绑定的预览配置（KV 崩溃定位用）"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "scripts/preview/**"
      - "scripts/sync-shared.ps1"
      - "pnpm-lock.yaml"
      - "pylock.toml"
      - ".github/workflows/preview.yml"

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  KAAS_PREVIEW_KV_NAMESPACE_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
  KAAS_PREVIEW_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
  PROD_HYPERDRIVE_ID: ${{ vars.PROD_HYPERDRIVE_ID }}

jobs:
  teardown:
    if: github.event.action == 'closed'
    name: Teardown preview resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Teardown（worker + Neon 分支 + Hyperdrive + 预览 KV/R2 前缀）
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
        run: python3 scripts/preview/teardown.py --pr "${{ env.PR_NUMBER }}"

  preflight:
    if: github.event.action != 'closed'
    name: Preflight（CF token 权限校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify token permissions
        run: python3 scripts/preview/preflight.py

  ensure:
    if: github.event.action != 'closed'
    name: Ensure（Neon 分支 + Hyperdrive）
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      PR_SLUG: ${{ steps.ensure.outputs.PR_SLUG }}
      NEON_BRANCH_NAME: ${{ steps.ensure.outputs.NEON_BRANCH_NAME }}
      HYPERDRIVE_ID: ${{ steps.ensure.outputs.HYPERDRIVE_ID }}
      PREVIEW_URL: ${{ steps.ensure.outputs.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure preview resources
        id: ensure
        run: python3 scripts/preview/ensure.py --pr "${{ env.PR_NUMBER }}"

  migrate:
    if: github.event.action != 'closed'
    name: DB migration（alembic upgrade head → 该 PR 的 Neon 分支）
    needs: [ensure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # 含密码的 DSN 不能走 job output（GitHub 会静默丢弃：实测
      # `Skip output 'PREVIEW_DATABASE_URL' since it may contain secret`）。
      - name: Resolve preview DB URL（job 内自取）
        run: |
          set -euo pipefail
          DSN="$(python3 scripts/preview/db-url.py --pr "${{ env.PR_NUMBER }}")"
          if [ -z "$DSN" ]; then
            echo "::error::db-url.py 未输出 DSN（检查 ensure 是否成功建分支）"; exit 1
          fi
          echo "DATABASE_URL=$DSN" >> "$GITHUB_ENV"
      - name: Alembic upgrade head（预览分支）
        working-directory: ./backend/orchestrator
        run: uv run --extra migrations alembic upgrade head

  build-frontend:
    if: github.event.action != 'closed'
    name: Build frontend（注入预览 API URL）
    needs: [ensure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace deps (shared + frontend)
        run: pnpm install --frozen-lockfile
      - name: Build（NEXT_EXPORT=1；API 指到本预览 worker）
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.ensure.outputs.PREVIEW_URL }}
      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out-preview
          path: frontend/out
          retention-days: 3

  deploy:
    if: github.event.action != 'closed'
    name: Deploy preview worker（workers.dev）
    needs: [ensure, migrate, build-frontend]
    runs-on: ubuntu-latest
    outputs:
      PREVIEW_URL: ${{ needs.ensure.outputs.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-out-preview
          path: frontend/out
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1
      - name: Verify mirror is complete
        shell: pwsh
        run: ./scripts/sync-shared.ps1 -Check
      - name: Render preview wrangler config
        working-directory: ./backend/worker
        env:
          PREVIEW_HYPERDRIVE_ID: ${{ needs.ensure.outputs.HYPERDRIVE_ID }}
          PREVIEW_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          PREVIEW_KV_NAMESPACE_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
        run: python3 ../../scripts/preview/render-wrangler-config.py --slug "${{ env.PR_NUMBER }}" --out wrangler.preview.jsonc ${{ github.event.inputs.no_kv == 'true' && '--no-kv' || '' }}
      - name: S5-d 防污染断言（部署前，渲染产物）
        if: github.event.inputs.no_kv != 'true'
        working-directory: ./backend/worker
        env:
          EXPECT_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          EXPECT_KV_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
          EXPECT_HYPERDRIVE_ID: ${{ needs.ensure.outputs.HYPERDRIVE_ID }}
          FORBIDDEN_R2_BUCKETS: ${{ vars.PROD_R2_BUCKET }}
          FORBIDDEN_HYPERDRIVE_IDS: ${{ vars.PROD_HYPERDRIVE_ID }}
        run: python3 ../../scripts/preview/assert-bindings.py --mode preview --script "kaas-preview-pr-${{ env.PR_NUMBER }}" --slug "${{ env.PR_NUMBER }}" --config wrangler.preview.jsonc --pre-deploy
      # 逐项显式注入（不用 toJSON(secrets)：避免整包 secrets 进入步骤环境）。
      - name: Set worker secrets（有则设置、无则告警不阻塞）
        working-directory: ./backend/worker
        env:
          S_JWT: ${{ secrets.JWT_SECRET }}
          S_ADMIN: ${{ secrets.ADMIN_SETUP_TOKEN }}
          S_S3AK: ${{ secrets.S3_ACCESS_KEY }}
          S_S3SK: ${{ secrets.S3_SECRET_KEY }}
        run: |
          set -uo pipefail
          put() { if [ -n "$2" ]; then printf '%s' "$2" | uv run pywrangler secret put "$1" -c wrangler.preview.jsonc || echo "::warning::secret $1 写入失败"; else echo "::warning::secret $1 未配置（预览该功能不可用）"; fi; }
          put JWT_SECRET "$S_JWT"
          put ADMIN_SETUP_TOKEN "$S_ADMIN"
          put S3_ACCESS_KEY "$S_S3AK"
          put S3_SECRET_KEY "$S_S3SK"
      - name: Deploy to Cloudflare Workers（workers.dev）
        working-directory: ./backend/worker
        run: uv run pywrangler deploy -c wrangler.preview.jsonc
      - name: S5-d 防污染断言（部署后，线上真实绑定）
        if: github.event.inputs.no_kv != 'true'
        working-directory: ./backend/worker
        env:
          EXPECT_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          EXPECT_KV_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
          EXPECT_HYPERDRIVE_ID: ${{ needs.ensure.outputs.HYPERDRIVE_ID }}
          FORBIDDEN_R2_BUCKETS: ${{ vars.PROD_R2_BUCKET }}
          FORBIDDEN_HYPERDRIVE_IDS: ${{ vars.PROD_HYPERDRIVE_ID }}
        run: python3 ../../scripts/preview/assert-bindings.py --mode preview --script "kaas-preview-pr-${{ env.PR_NUMBER }}" --slug "${{ env.PR_NUMBER }}"
      - name: Smoke（预览 /health 回显 pr_slug + 未鉴权 401；最多等 6 分钟）
        run: |
          set -uo pipefail
          API="${{ needs.ensure.outputs.PREVIEW_URL }}"
          ok=0
          for i in $(seq 1 36); do
            body=$(curl -fsS --max-time 10 "$API/health" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "pr_slug"; then
              echo "attempt $i ready: $body"; ok=1; break
            fi
            echo "attempt $i not ready"; sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::预览 /health 未就绪"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API/api/v1/leads")
          echo "/api/v1/leads -> $code"
          if [ "$code" != "401" ]; then echo "::error::预览 API 期望 401，实际 $code"; exit 1; fi

  comment:
    # 手动 dispatch 无 PR 可评论；仅 PR 事件评论
    if: github.event_name == 'pull_request'
    name: PR 评论预览 URL
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment preview URL（幂等：同标记评论只更新不刷屏）
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- kaas-preview-url -->';
            const body = `${marker}\n🚀 预览环境已就绪：${process.env.PREVIEW_URL}\n\n` +
              `- 数据库：Neon 分支 \`preview-pr-${process.env.PR_NUMBER}\`（从 production 派生，独立凭证）\n` +
              `- 存储：R2 \`kaas-preview-storage\`（键前缀 \`pr-${process.env.PR_NUMBER}/\`）+ 预览 KV\n` +
              `- PR 关闭时自动回收（teardown）`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: process.env.PR_NUMBER,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: process.env.PR_NUMBER, body,
              });
            }
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.PREVIEW_URL }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
