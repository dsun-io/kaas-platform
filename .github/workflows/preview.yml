name: preview

# S5 预览环境（README §2 目标态矩阵；2026-10-20 用户裁决全量做）：
#   PR open/synchronize/reopened → preflight（CF token 权限校验）→ ensure（Neon 分支 +
#   Hyperdrive）→ 迁移（alembic upgrade head 到该 PR 分支）→ 构建前端（注入预览 API URL）→
#   部署预览 worker（workers.dev）→ PR 评论预览 URL；PR closed → teardown 全量回收。
#
# 红线（README §2.3 规则 8/9）：预览 worker 绝不绑生产 Hyperdrive/R2/域名；
# 生产 worker 绝不绑任何预览资源。防污染断言见 scripts/preview/assert-bindings.py，
# 任一失败即中止。

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # 只有会影响部署产物的变更才触发预览部署（文档/归档不动资源、不烧额度）
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "scripts/preview/**"
      - "scripts/sync-shared.ps1"
      - "pnpm-lock.yaml"
      - "pylock.toml"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  pull-requests: write   # 预览 URL 评论

# 同一 PR 串行；新推送取消旧的部署（但资源回收并发安全：ensure/teardown 均幂等）
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # 共享预览资源标识（repo **variables**，非机密；本机已建，见 docs/ENV_VERIFICATION）
  KAAS_PREVIEW_KV_NAMESPACE_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
  KAAS_PREVIEW_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}

jobs:
  # ── PR 关闭：只做回收，其它 job 全跳过 ──────────────────────────────────────
  teardown:
    if: github.event.action == 'closed'
    name: Teardown preview resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Teardown（worker + Neon 分支 + Hyperdrive + 预览 KV/R2 前缀）
        env:
          # R2 对象清理可选：配了 S3 密钥才真正删对象，否则脚本打印手动清理指引
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
        run: python3 scripts/preview/teardown.py --pr "${{ github.event.pull_request.number }}"

  # ── PR 打开/同步：preflight → ensure → migrate → build → deploy → 评论 ──────
  preflight:
    if: github.event.action != 'closed'
    name: Preflight（CF token 权限校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify token permissions
        run: python3 scripts/preview/preflight.py

  ensure:
    if: github.event.action != 'closed'
    name: Ensure（Neon 分支 + Hyperdrive）
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      PR_SLUG: ${{ steps.ensure.outputs.PR_SLUG }}
      NEON_BRANCH_NAME: ${{ steps.ensure.outputs.NEON_BRANCH_NAME }}
      PREVIEW_DATABASE_URL: ${{ steps.ensure.outputs.PREVIEW_DATABASE_URL }}
      HYPERDRIVE_ID: ${{ steps.ensure.outputs.HYPERDRIVE_ID }}
      PREVIEW_URL: ${{ steps.ensure.outputs.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure preview resources
        id: ensure
        run: python3 scripts/preview/ensure.py --pr "${{ github.event.pull_request.number }}"

  migrate:
    if: github.event.action != 'closed'
    name: DB migration（alembic upgrade head → 该 PR 的 Neon 分支）
    needs: [ensure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Alembic upgrade head（预览分支）
        working-directory: ./backend/orchestrator
        env:
          DATABASE_URL: ${{ needs.ensure.outputs.PREVIEW_DATABASE_URL }}
        run: uv run --extra migrations alembic upgrade head

  build-frontend:
    if: github.event.action != 'closed'
    name: Build frontend（注入预览 API URL）
    needs: [ensure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace deps (shared + frontend)
        run: pnpm install --frozen-lockfile
      - name: Build（NEXT_EXPORT=1；API 指到本预览 worker 的 workers.dev）
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.ensure.outputs.PREVIEW_URL }}
      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out-preview
          path: frontend/out
          retention-days: 3

  deploy:
    if: github.event.action != 'closed'
    name: Deploy preview worker（workers.dev）
    needs: [ensure, migrate, build-frontend]
    runs-on: ubuntu-latest
    outputs:
      PREVIEW_URL: ${{ needs.ensure.outputs.PREVIEW_URL }}
    environment:
      name: preview
      url: ${{ needs.ensure.outputs.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-out-preview
          path: frontend/out

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Verify mirror is complete
        shell: pwsh
        run: ./scripts/sync-shared.ps1 -Check

      - name: Render preview wrangler config
        working-directory: ./backend/worker
        env:
          PREVIEW_HYPERDRIVE_ID: ${{ needs.ensure.outputs.HYPERDRIVE_ID }}
          PREVIEW_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          PREVIEW_KV_NAMESPACE_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
        run: |
          python3 ../../scripts/preview/render-wrangler-config.py \
            --slug "${{ github.event.pull_request.number }}" \
            --out wrangler.preview.jsonc

      - name: S5-d 防污染断言（部署前：渲染产物，失败即中止）
        working-directory: ./backend/worker
        env:
          EXPECT_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          EXPECT_KV_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
          EXPECT_HYPERDRIVE_ID: ${{ needs.ensure.outputs.HYPERDRIVE_ID }}
          FORBIDDEN_R2_BUCKETS: ${{ vars.PROD_R2_BUCKET }}
          FORBIDDEN_HYPERDRIVE_IDS: ${{ vars.PROD_HYPERDRIVE_ID }}
        run: |
          python3 ../../scripts/preview/assert-bindings.py \
            --mode preview \
            --script "kaas-preview-pr-${{ github.event.pull_request.number }}" \
            --slug "${{ github.event.pull_request.number }}" \
            --config wrangler.preview.jsonc \
            --pre-deploy

      - name: Set worker secrets（存在的才设置；缺失列警告不中止）
        working-directory: ./backend/worker
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          for name in JWT_SECRET ADMIN_SETUP_TOKEN S3_ACCESS_KEY S3_SECRET_KEY \
                      RESEND_API_KEY BROWSER_RENDERING_TOKEN RESET_FROM_EMAIL; do
            value=$(printf '%s' "$SECRETS_JSON" | python3 -c "import json,os; print(json.loads(os.environ['SECRETS_JSON']).get('$name',''))")
            if [ -n "$value" ]; then
              printf '%s' "$value" | uv run pywrangler secret put "$name" \
                -c wrangler.preview.jsonc \
                || echo "::warning::secret $name 写入预览 worker 失败（功能将不可用）"
            else
              echo "::warning::secret $name 未配置 ⇒ 预览 worker 该功能不可用（生产不受影响）"
            fi
          done

      - name: Deploy to Cloudflare Workers（workers.dev）
        working-directory: ./backend/worker
        run: uv run pywrangler deploy -c wrangler.preview.jsonc

      - name: S5-d 防污染断言（部署后：线上真实绑定）
        working-directory: ./backend/worker
        env:
          EXPECT_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          EXPECT_KV_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
          EXPECT_HYPERDRIVE_ID: ${{ needs.ensure.outputs.HYPERDRIVE_ID }}
          FORBIDDEN_R2_BUCKETS: ${{ vars.PROD_R2_BUCKET }}
          FORBIDDEN_HYPERDRIVE_IDS: ${{ vars.PROD_HYPERDRIVE_ID }}
        run: |
          python3 ../../scripts/preview/assert-bindings.py \
            --mode preview \
            --script "kaas-preview-pr-${{ github.event.pull_request.number }}" \
            --slug "${{ github.event.pull_request.number }}"

      - name: Smoke test（预览 /health 回显 pr_slug + 未鉴权 401）
        run: |
          set -uo pipefail
          API="${{ needs.ensure.outputs.PREVIEW_URL }}"
          ok=0
          for i in $(seq 1 18); do
            body=$(curl -fsS --max-time 10 "$API/health" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"pr_slug":"${{ github.event.pull_request.number }}"'; then
              echo "attempt $i: $body"; ok=1; break
            fi
            echo "attempt $i: not ready yet ($body)"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::预览 /health 未回显 pr_slug（PR_SLUG 未注入或 Worker 未起）"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API/api/v1/leads")
          echo "/api/v1/leads -> $code"
          if [ "$code" != "401" ]; then
            echo "::error::预览 API 期望 401（路由存在且需鉴权），实际 $code"; exit 1
          fi

  comment:
    if: github.event.action != 'closed'
    name: PR 评论预览 URL
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL（幂等：同标记评论只更新不刷屏）
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- kaas-preview-url -->';
            const body = `${marker}\n🚀 预览环境已就绪：${process.env.PREVIEW_URL}\n\n` +
              `- 数据库：Neon 分支 \`preview-pr-${process.env.PR_NUMBER}\`（从 production 派生）\n` +
              `- 存储：R2 \`kaas-preview-storage\`（键前缀 \`pr-${process.env.PR_NUMBER}/\`）+ 预览 KV\n` +
              `- PR 关闭时自动回收（teardown）`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: process.env.PR_NUMBER,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: process.env.PR_NUMBER, body,
              });
            }
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.PREVIEW_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
