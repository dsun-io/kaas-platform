name: probe3
# 临时探针 3（2026-10-20）：完全复刻 preview.yml 的 on/permissions/concurrency/env 头部，
# 只把 job 换成 echo —— 若 dispatch 被 action_required，则门禁来自"头部配置"而非 job 内容。
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "伪 PR 号（数字）"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "backend/**"

permissions:
  contents: read

concurrency:
  group: probe3-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  echo:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe3 ok pr=$PR_NUMBER"
