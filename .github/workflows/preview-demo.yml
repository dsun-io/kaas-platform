name: preview

# S5 预览环境（README §2 目标态矩阵；2026-10-20 用户裁决全量做）：
#   PR open/synchronize/reopened → preflight（CF token 权限校验）→ ensure（Neon 分支 +
#   Hyperdrive）→ 迁移（alembic upgrade head 到该 PR 分支）→ 构建前端（注入预览 API URL）→
#   部署预览 worker（workers.dev）→ PR 评论预览 URL；PR closed → teardown 全量回收。
#
# 红线（README §2.3 规则 8/9）：预览 worker 绝不绑生产 Hyperdrive/R2/域名；
# 生产 worker 绝不绑任何预览资源。防污染断言见 scripts/preview/assert-bindings.py，
# 任一失败即中止。

on:
  # 手动触发：用 CI 工具链部署一个演示预览（2026-10-20 新增；本机 pyodide 工具链打出的包
  # 会触发 1101/1102 资源限额崩溃，需 CI 版对照验证——见 PROBLEM_STATUS 交接摘要）。
  workflow_dispatch:
    inputs:
      pr_number:
        description: "伪 PR 号（数字，用于派生 slug/分支名；演示用）"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # 只有会影响部署产物的变更才触发预览部署（文档/归档不动资源、不烧额度）
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "scripts/preview/**"
      - "scripts/sync-shared.ps1"
      - "pnpm-lock.yaml"
      - "pylock.toml"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  # 注：pull-requests: write 已下沉到 comment job（2026-10-20：工作流级写权限会让
  # 公开仓库的 dispatch 触发被 GitHub 标 action_required 待审批，见 PROBLEM_STATUS 交接摘要）。

# 同一 PR 串行；新推送取消旧的部署（但资源回收并发安全：ensure/teardown 均幂等）
concurrency:
  group: preview-pr-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  # 统一 PR 号口径：PR 事件取 event.pull_request.number，手动 dispatch 取 inputs.pr_number
  PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # 共享预览资源标识（repo **variables**，非机密；本机已建，见 docs/ENV_VERIFICATION）
  KAAS_PREVIEW_KV_NAMESPACE_ID: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
  KAAS_PREVIEW_R2_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
  # 生产 Hyperdrive id：预览脚本据此读 origin.database，保证预览库与生产 worker 同库（neondb）
  PROD_HYPERDRIVE_ID: ${{ vars.PROD_HYPERDRIVE_ID }}

jobs:
  # ── PR 关闭：只做回收，其它 job 全跳过 ──────────────────────────────────────
  teardown:
    if: github.event.action == 'closed'
    name: Teardown preview resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Teardown（worker + Neon 分支 + Hyperdrive + 预览 KV/R2 前缀）
        env:
          # R2 对象清理可选：配了 S3 密钥才真正删对象，否则脚本打印手动清理指引
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
        run: python3 scripts/preview/teardown.py --pr "${{ env.PR_NUMBER }}"

  # ── PR 打开/同步：preflight → ensure → migrate → build → deploy → 评论 ──────
  preflight:
    if: github.event.action != 'closed'
    name: Preflight（CF token 权限校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify token permissions
        run: python3 scripts/preview/preflight.py

  ensure:
    if: github.event.action != 'closed'
    name: Ensure（Neon 分支 + Hyperdrive）
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      PR_SLUG: ${{ steps.ensure.outputs.PR_SLUG }}
      NEON_BRANCH_NAME: ${{ steps.ensure.outputs.NEON_BRANCH_NAME }}
      # 注：PREVIEW_DATABASE_URL 不再作为 job output —— GitHub 会静默丢弃含密码的 output
      # (`Skip output ... since it may contain secret`)，改由 migrate job 用 db-url.py 自取。
      HYPERDRIVE_ID: ${{ steps.ensure.outputs.HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure preview resources
        id: ensure
        run: python3 scripts/preview/ensure.py --pr "${{ env.PR_NUMBER }}"

  migrate:
    if: github.event.action != 'closed'
    name: DB migration（alembic upgrade head → 该 PR 的 Neon 分支）
    needs: [ensure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # 含密码的 DSN 不能经 job output 传递（GitHub 会静默丢弃：实测
      # `Skip output 'PREVIEW_DATABASE_URL' since it may contain secret`），
      # 故在 job 内自取并写进 $GITHUB_ENV（env 不受该限制，日志也不回显）。
      - name: Resolve preview DB URL（job 内自取，规避 output 丢弃）
        run: |
          set -euo pipefail
          DSN="$(python3 scripts/preview/db-url.py --pr "${{ env.PR_NUMBER }}")"
          if [ -z "$DSN" ]; then
            echo "::error::db-url.py 未输出 DSN（检查 ensure 是否成功建分支）"; exit 1
          fi
          echo "DATABASE_URL=$DSN" >> "$GITHUB_ENV"
      - name: Alembic upgrade head（预览分支）
        working-directory: ./backend/orchestrator
        run: uv run --extra migrations alembic upgrade head

  build-frontend:
    if: github.event.action != 'closed'
    name: Build frontend（注入预览 API URL）
    needs: [ensure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace deps (shared + frontend)
        run: pnpm install --frozen-lockfile
      - name: Build（NEXT_EXPORT=1；API 指到本预览 worker 的 workers.dev）
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.ensure.outputs.PREVIEW_URL }}
      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out-preview
          path: frontend/out
          retention-days: 3

