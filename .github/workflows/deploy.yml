name: deploy

# 生产发布（ADR-008 两层架构）：一条 workflow、两个部署 job（内核 → 门面）。
#
# ┌─ 2026-10-22 改造口径 ────────────────────────────────────────────────────┐
# │ 运行时是双 Worker：kaas-edge（TS 门面，持有生产域名）+ kaas（Python 内核， │
# │ 无公网域名，仅 Service Binding）。发布流水线必须与运行时一致：             │
# │   build-frontend（ubuntu 静态导出 + assets:check）                        │
# │   migrate（Alembic → 生产库；target=edge 时跳过）                         │
# │   deploy-kernel（内核；先跑部署拓扑门禁；再 pywrangler deploy）            │
# │   deploy-edge（门面；needs deploy-kernel ⇒ 顺序由依赖保证）               │
# │ target=both（默认）/ kernel / edge；一次 dispatch 完成一次发布。          │
# │ 域名纪律：只有 kaas-edge 可声明 custom domain；内核 routes 必须为 []      │
# │ （scripts/check-deploy-domains.py 静态 + --live 双重拦截）。               │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 自动部署（2026-10-22 用户下令恢复）：push 到 main 自动触发；先由 wait-for-ci 等待同 SHA 的
# CI（backend:test / contracts:check / Frontend CI / ts-edge）全绿，再 build → migrate → 内核 → 门面。
# workflow_dispatch 保留用于排障与单端发布（target=kernel/edge）；文档/归档改动不触发（paths-ignore）。
#
# 生产 secrets 必须**手工绑定在 Worker 上**（wrangler deploy 不读 GitHub repo secrets）：
#   kernel: JWT_SECRET / ADMIN_SETUP_TOKEN / S3_* / RESEND_API_KEY（由本流程从 RESEND_API_KEY_PROD 同步）
#   edge:   JWT_SECRET（与内核同值，双端轮换必须同步）/ RESEND_API_KEY / S3_*
# 静态导出产物铁律（2026-10-22）：禁止用 Windows 本机构建的 out/ 直接 deploy；
# 本 workflow 固定 ubuntu runner 构建并跑 pnpm assets:check（见 AGENTS.md）。

on:
  push:
    branches: [main]
    # 文档/归档不触发部署（避免无谓的生产发布与 Actions 消耗）
    paths-ignore:
      - "docs/**"
      - "archive/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标：both=内核+门面（默认，推荐）；kernel=只内核；edge=只门面"
        type: choice
        options:
          - both
          - kernel
          - edge
        default: both
      confirm:
        description: "生产发布确认：输入 deploy 才执行"
        required: true
        default: ""

concurrency:
  # 串行发布，避免两个 dispatch 交叉覆盖（内核/门面必须成对有序）
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # actions/upload-artifact + download-artifact

env:
  PYTHONUTF8: "1"

jobs:
  # push 触发的自动发布：先等待同一个 commit 上的 CI 全部结束并全绿。
  # 为什么不让 deploy 自己重复跑测试：CI 已在 push 上跑（backend:test/contracts:check/
  # Frontend CI/ts-edge），再跑一遍等于双倍 Actions 消耗；这里用 API 等结果即可。
  # 任何 CI 失败 ⇒ 直接失败、不进入 build/migrate/deploy（绝不把红代码发到生产）。
  wait-for-ci:
    name: Wait for same-SHA CI to pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for push CI runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # 给 push 同时触发的 CI 一点注册时间；随后轮询到全部 completed。
          sleep 120
          deadline=$(( $(date +%s) + 1500 ))
          empty_waits=0
          while :; do
            raw=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100")
            runs=$(jq -c --arg cur "$CURRENT_RUN" '[.workflow_runs[] | select((.id|tostring) != $cur and .name != "deploy" and .event == "push") | {name: .name, status: .status, conclusion: .conclusion}]' <<<"$raw")
            total=$(jq 'length' <<<"$runs")
            if [ "$total" -eq 0 ]; then
              empty_waits=$((empty_waits + 1))
              if [ "$empty_waits" -ge 3 ]; then
                echo "::warning::该 SHA 没有 push CI 运行（可能只改了本 workflow）⇒ 直接进入构建"
                exit 0
              fi
              sleep 30; continue
            fi
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$pending" -gt 0 ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::同 SHA 的 CI 超过 25 分钟仍未完成: $(jq -r '[.[] | select(.status != "completed") | .name] | join(", ")' <<<"$runs")"
                exit 1
              fi
              sleep 20; continue
            fi
            bad=$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | (.name + "=" + (.conclusion // "null"))] | join(", ")' <<<"$runs")
            if [ -n "$bad" ]; then
              echo "::error::同 SHA 的 CI 未全绿: $bad"
              exit 1
            fi
            echo "✅ 同 SHA 的 CI 全绿: $(jq -r '[.[].name] | join(", ")' <<<"$runs")"
            exit 0
          done

  build-frontend:
    name: Build frontend (Linux static export)
    needs: [wait-for-ci]
    if: ${{ !cancelled() && needs.wait-for-ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate dispatch inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          # push 触发时没有 inputs：target 缺省 both、无需 confirm；dispatch 仍要求 confirm=deploy 防误触。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM" != "deploy" ]; then
            echo "::error::生产发布必须输入 confirm=deploy（防误触）"; exit 1
          fi
          target="${TARGET:-both}"
          case "$target" in
            both|kernel|edge) ;;
            *) echo "::error::target 非法: $target"; exit 1 ;;
          esac
          echo "event=$EVENT_NAME target=$target"

      - uses: actions/checkout@v4

      # 顺序硬要求：pnpm 先装，setup-node 的 cache: pnpm 才能解析（与 ts-edge.yml 同口径）。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace deps (shared + frontend)
        run: pnpm install --frozen-lockfile

      # 2026-10-22 硬约束：必须在 Linux 构建（Windows 的 path.relative 会产生反斜杠，
      # 逐段预取文件会被写成目录 ⇒ 全站预取 404）。
      - name: Build (NEXT_EXPORT=1 → out/)
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_EXPORT: "1"

      # 产物门禁：无含 "\" 的文件名、无 __next.* 目录、/_next/static/* 引用全部可解析。
      - name: Assets export gate (pnpm assets:check)
        working-directory: ./frontend
        run: pnpm assets:check

      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 7

  # 方案 B · 迁移执行位置 = CI（README §5）：Alembic 是唯一 Schema 变更来源，
  # 部署内核前先 upgrade head，避免「代码已上线、库还没迁」。
  # 生产库连接串放 secret PROD_DATABASE_URL；未配置时跳过并告警（保持手动迁移）。
  migrate:
    name: DB migration (alembic upgrade head)
    # 防误触：confirm/target 校验在 build-frontend 第一步；migrate 是唯一写生产库的 job，
    # 必须等 build-frontend 成功（confirm 错误时 build 失败 ⇒ 绝不迁移）。
    needs: [build-frontend]
    if: ${{ !cancelled() && github.event.inputs.target != 'edge' && needs.build-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Notice · PROD_DATABASE_URL 未配置（跳过迁移）
        if: env.MIGRATION_DATABASE_URL == ''
        run: |
          echo "::warning::secret PROD_DATABASE_URL 未配置 ⇒ 跳过自动迁移（当前仍为手动迁移）。"
          exit 0

      - name: Install migration deps
        if: env.MIGRATION_DATABASE_URL != ''
        working-directory: ./backend/orchestrator
        run: uv sync --extra migrations

      - name: Alembic upgrade head
        if: env.MIGRATION_DATABASE_URL != ''
        working-directory: ./backend/orchestrator
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: uv run --extra migrations alembic upgrade head

  deploy-kernel:
    name: Deploy kernel kaas (no public domain)
    needs: [build-frontend, migrate]
    if: ${{ !cancelled() && github.event.inputs.target != 'edge' && needs.build-frontend.result == 'success' && needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # 内核在 2026-11-04 回滚窗口结束前仍保留 assets 绑定（main.py:3238 SPA 回退），
      # 因此部署内核仍需要前端产物；assets 退场后本步骤可只给门面。
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # backend/worker/.gitignore 忽略 src/kaas_common/ 镜像；漏同步 ⇒ /health shared.loaded=false
      # 且报价引擎整包缺失（报价工位 503）。同步是幂等的。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Verify mirror is complete
        shell: pwsh
        run: ./scripts/sync-shared.ps1 -Check

      - name: Runtime dependency gate
        run: uv run --no-project python scripts/check-runtime-deps.py

      # 域名归属门禁（静态）：内核 routes 必须为 []；门面必须持有两条生产域名。
      # 这是 2026-10-21 切流配置债的永久防线（wrangler 部署会把域名从门面抢回内核）。
      - name: Deploy topology gate (static)
        run: uv run --no-project python scripts/check-deploy-domains.py

      # 域名归属门禁（线上，部署前）：
      # 若域名已被抢回内核，**不要**因此中断整轮 —— target=both 里修复正是靠后续 deploy-edge
      # 把域名改回门面。这里降级为 warning（continue-on-error），由 edge 的部署后断言兜底。
      - name: Deploy topology gate (live preflight)
        continue-on-error: true
        run: uv run --no-project python scripts/check-deploy-domains.py --live --retries 12 --delay 10

      # 密钥同步（2026-10-21）：生产 Resend key 的唯一来源 = GitHub secret RESEND_API_KEY_PROD
      # （系统专用命名；DSH-Admin 只给 DSH 用，不得配置到平台/CI）。
      # 2026-10-22：同步放在 deploy 之前 —— 失败时不要留下「内核已上线但 secret 未同步」的半成品。
      - name: Sync production RESEND_API_KEY（系统密钥唯一来源）
        working-directory: backend/worker
        env:
          S_RESEND: ${{ secrets.RESEND_API_KEY_PROD }}
        run: |
          if [ -z "$S_RESEND" ]; then
            echo "::warning::RESEND_API_KEY_PROD 未配置，跳过同步（忘记密码邮件将不可用）"
            exit 0
          fi
          printf '%s' "$S_RESEND" | uv run pywrangler secret put RESEND_API_KEY

      - name: Deploy kernel to Cloudflare Workers
        working-directory: backend/worker
        run: uv run pywrangler deploy

      # S5-d 生产侧防污染断言（线上实际绑定：R2/Hyperdrive 不得等于预览值/注入 PR_SLUG）。
      - name: S5-d 防污染断言（production 线上绑定）
        env:
          EXPECT_PROD_R2_BUCKET: ${{ vars.PROD_R2_BUCKET }}
          EXPECT_PROD_HYPERDRIVE_ID: ${{ vars.PROD_HYPERDRIVE_ID }}
          FORBIDDEN_R2_BUCKETS: ${{ vars.KAAS_PREVIEW_R2_BUCKET }}
          FORBIDDEN_KV_IDS: ${{ vars.KAAS_PREVIEW_KV_NAMESPACE_ID }}
        run: |
          uv run --no-project python scripts/preview/assert-bindings.py \
            --mode production --script kaas

      - name: Assert kernel secrets present (names only)
        run: |
          names=$(curl -fsS --retry 3 --retry-connrefused --retry-delay 2 --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kaas/secrets" \
            | jq -r '.result[].name' | sort)
          echo "$names"
          for required in JWT_SECRET ADMIN_SETUP_TOKEN RESEND_API_KEY S3_ACCESS_KEY S3_SECRET_KEY; do
            if ! printf '%s\n' "$names" | grep -qx "$required"; then
              echo "::error::内核缺少 secret: $required"; exit 1
            fi
          done

      # 内核没有公网域名，只能用门面的深探针（/health?deep=1 经 KERNEL binding 调内核）。
      # 门面尚未升级到带 deep 探针的版本时（本流水线首次上线前）降级为 warning；
      # 其余情况（门面异常 / 内核 status 非 ok / shared 未加载）一律 error。
      - name: Kernel liveness probe (via edge deep health)
        run: |
          set +e
          API=https://api.kaas.powervoy.com
          # 2026-10-24：Python 内核每次部署后第一批冷启动偶发 scriptThrewException /
          # exceededResources（CF isolate 启动失败，用户侧表现为 502 kernel unreachable）。
          # 这里连续探到 **2 次** deep health 全绿才算通过：既做部署门禁，也顺手把新版
          # isolate 暖起来；门面侧另有 fetch 重试兜底（backend/ts-worker/src/proxy.ts）。
          consecutive=0
          passed=0
          for i in $(seq 1 10); do
            body=$(curl -sS --retry 2 --retry-connrefused --retry-delay 2 --max-time 60 "$API/health?deep=1" 2>/dev/null)
            if printf '%s' "$body" | jq -e '.service=="kaas-edge" and .kernel.status=="ok" and .kernel.shared_loaded==true' >/dev/null 2>&1; then
              consecutive=$((consecutive+1))
              echo "attempt $i: OK ($consecutive/2) $body"
              if [ "$consecutive" -ge 2 ]; then passed=1; break; fi
            else
              consecutive=0
              echo "attempt $i: kernel not ready: $body"
            fi
            sleep 5
          done
          if [ "$passed" != "1" ]; then
            echo "::error::内核探活失败（需要连续 2 次 kernel.status=ok + shared_loaded=true）"; exit 1
          fi
          echo "✅ kernel liveness passed（连续 2 次）"

  deploy-edge:
    name: Deploy edge kaas-edge (public domains)
    needs: [build-frontend, deploy-kernel]
    if: ${{ !cancelled() && github.event.inputs.target != 'kernel' && needs.build-frontend.result == 'success' && (github.event.inputs.target == 'edge' || needs.deploy-kernel.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      # 顺序硬要求：pnpm 必须先装好，setup-node 的 cache: pnpm 才能解析
      # （反了会报 Unable to locate executable file: pnpm；ts-edge.yml 2026-10-22 实测）。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/ts-worker/pnpm-lock.yaml

      - name: Install ts-worker deps
        working-directory: ./backend/ts-worker
        run: pnpm install --frozen-lockfile

      # 门面侧密钥（2026-10-22 补）：此前 kaas-edge 只有 JWT_SECRET，RESEND/S3 缺失 ⇒
      # 忘记密码邮件/直传静默降级而流水线仍绿。唯一来源 = GitHub secrets，printf %s 不追加换行。
      - name: Sync edge secrets (RESEND / S3)
        working-directory: ./backend/ts-worker
        env:
          S_RESEND: ${{ secrets.RESEND_API_KEY_PROD }}
          S3_AK: ${{ secrets.S3_ACCESS_KEY }}
          S3_SK: ${{ secrets.S3_SECRET_KEY }}
        run: |
          set +e
          rc=0
          if [ -n "$S_RESEND" ]; then printf '%s' "$S_RESEND" | pnpm wrangler secret put RESEND_API_KEY || rc=1; else echo "::warning::RESEND_API_KEY_PROD 未配置"; fi
          if [ -n "$S3_AK" ]; then printf '%s' "$S3_AK" | pnpm wrangler secret put S3_ACCESS_KEY || rc=1; else echo "::warning::S3_ACCESS_KEY 未配置"; fi
          if [ -n "$S3_SK" ]; then printf '%s' "$S3_SK" | pnpm wrangler secret put S3_SECRET_KEY || rc=1; else echo "::warning::S3_SECRET_KEY 未配置"; fi
          exit $rc

      # 部署前静态门禁：确保门面 config 仍持有两条域名、内核 config 仍为空。
      - name: Deploy topology gate (static)
        run: python3 scripts/check-deploy-domains.py

      - name: Deploy edge to Cloudflare Workers
        working-directory: ./backend/ts-worker
        run: pnpm wrangler deploy

      # 部署后线上归属断言：两条域名必须归 kaas-edge（等待 Cloudflare 归属切换完成）。
      - name: Verify live domain ownership (edge)
        run: python3 scripts/check-deploy-domains.py --live --retries 24 --delay 10

      # 密钥存在性（只查名字，不读值）：JWT_SECRET 缺失/漂移会让所有带 token 请求 503。
      - name: Assert edge secrets present (names only)
        run: |
          names=$(curl -fsS --retry 3 --retry-connrefused --retry-delay 2 --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kaas-edge/secrets" \
            | jq -r '.result[].name' | sort)
          echo "$names"
          for required in JWT_SECRET RESEND_API_KEY S3_ACCESS_KEY S3_SECRET_KEY; do
            if ! printf '%s\n' "$names" | grep -qx "$required"; then
              echo "::error::门面缺少 secret: $required"; exit 1
            fi
          done

      # 冒烟：门面存活 + 内核深探针 + 鉴权 + 静态资产 chunk 可解析。
      # 2026-10-22：JSON 判断改 jq（不依赖键序）；curl 带重试；set +e 保证自写诊断生效
      # （GitHub 默认 bash -e 会让失败 curl 直接退出、跳过 ::error:: 文案）。
      - name: "Smoke test (production: edge + kernel)"
        run: |
          set +e
          API=https://api.kaas.powervoy.com
          WEB=https://kaas.powervoy.com
          curl_api() { curl -sS --retry 3 --retry-connrefused --retry-delay 2 --max-time 20 "$@"; }

          echo "── 1) 门面存活（/health 必须是 kaas-edge JSON）──"
          ok=0
          for i in $(seq 1 24); do
            body=$(curl_api "$API/health")
            if printf '%s' "$body" | jq -e '.status=="ok" and .service=="kaas-edge"' >/dev/null 2>&1; then
              echo "attempt $i: $body"; ok=1; break
            fi
            echo "attempt $i: not ready: $body"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::门面 /health 未返回 kaas-edge（域名可能又被打回内核）"; exit 1
          fi

          echo "── 2) 内核深探针（门面 → KERNEL binding）──"
          ok=0
          for i in $(seq 1 12); do
            body=$(curl_api "$API/health?deep=1")
            if printf '%s' "$body" | jq -e '.kernel.status=="ok" and .kernel.shared_loaded==true' >/dev/null 2>&1; then
              echo "attempt $i: $body"; ok=1; break
            fi
            echo "attempt $i: kernel not ready: $body"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::内核探活失败（/health?deep=1 未返回 kernel.status=ok + shared_loaded=true）"; exit 1
          fi

          echo "── 3) 鉴权（未带 token 必须 401，证明门面路由与鉴权生效）──"
          for p in /api/v1/research/categories /api/v1/research/stats \
                   /api/v1/leads /api/v1/ai/tasks \
                   /api/v1/export-quote/products \
                   /api/v1/tax-archives /api/v1/product-tax-rates \
                   /api/v1/quotes; do
            code=$(curl_api -o /dev/null -w '%{http_code}' "$API$p")
            echo "$p -> $code"
            if [ "$code" != "401" ]; then
              echo "::error::$p 期望 401（路由存在且需鉴权），实际 $code"; exit 1
            fi
          done

          echo "── 4) 静态资产（页面 200 + 引用 chunk 200）──"
          for p in / /login /research /leadgen /intel /outreach /settings/ai-providers; do
            code=$(curl_api -o /dev/null -w '%{http_code}' "$WEB$p")
            echo "$p -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$p 期望 200，实际 $code"; exit 1
            fi
          done
          html=$(curl_api "$WEB/login")
          chunks=$(printf '%s' "$html" | grep -oE '/_next/static/[^"]+\.js' | sort -u | head -n 5)
          if [ -z "$chunks" ]; then
            echo "::error::/login 未引用任何 /_next/static/*.js（导出产物异常）"; exit 1
          fi
          for chunk in $chunks; do
            code=$(curl_api -o /dev/null -w '%{http_code}' "$WEB$chunk")
            echo "$chunk -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$chunk 期望 200，实际 $code（hydration 前提不成立）"; exit 1
            fi
          done

          echo "── 5) OpenAPI（必须是真 JSON，不能是 SPA 回退的 200）──"
          if ! curl_api "$API/openapi.json" | jq -e '.openapi and (.paths | length > 0)' >/dev/null 2>&1; then
            echo "::error::/openapi.json 不是有效 OpenAPI JSON（可能是 SPA 回退 200）"; exit 1
          fi
          echo "✅ smoke test passed（edge + kernel + assets）"

      # 2026-10-24 事故驱动的补充观测：上面的探针是**匿名**请求，当日内核错误率 56% 时它全程返回 ok
      # （失败是概率性的、且探针请求不在用户路径上）。这里拉一次真实调用错误率做**观测**。
      # 用 continue-on-error：20 分钟窗口必然包含"部署前"的旧版本流量，不应该因此阻塞发布；
      # 持续、阻塞式的告警在 .github/workflows/kernel-health.yml（每 15 分钟）。
      - name: Kernel error-rate observation (post-deploy, non-blocking)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          python3 scripts/check-kernel-error-rate.py --minutes 20 --max-error-rate 0.30 --script kaas
          code=$?
          if [ "$code" != "0" ]; then
            echo "::warning::内核错误率超阈值（窗口含部署前流量，仅观测）—— 持续监控见 kernel-health.yml"
          fi
          exit 0
