name: deploy

# 2026-10-18：生产发布（税务档案 / 产品税率 / 成本手填 / 整单保险 / 批量报价）
# 仓库转公开后 GitHub Actions 额度限制解除；本文件既监听 main push，也支持手动触发。

# push 到生产分支 main 即自动构建前端并部署单 Worker "kaas"（含静态资产）。
# 生产 secrets（JWT_SECRET / ADMIN_SETUP_TOKEN / RESEND_API_KEY）已绑定在
# Worker 上，wrangler deploy 不会清除，无需在 CI 中重设。
#
# 分支策略（2026-09-28 切换）：
#   · main = 生产分支（本文件只监听它）；已归档旧的 feature/intel-workstation-v1
#   · feat/trade-doc-templates = 唯一的开发分支（未完成的功能留在这里，完成后合入 main）
on:
  push:
    branches:
      - main
    # 纯文档 / 临时脚本提交不触发生产重部署。
    # 每次部署都会让全部 isolate 失效并经历数分钟冷启动窗口（见 DEPLOY.md §0.2），
    # 不能因为改一个 .md 就重发一次生产版本。
    # 需要强制重发时走 workflow_dispatch。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.tools/**'
      - '**/.tools/**'
  workflow_dispatch:

# 串行部署，避免并发 push 把旧版本覆盖到新版本之后
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build frontend (static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 12（与本地 corepack 口径一致），先启用再让 setup-node 缓存 pnpm store
      - name: Enable pnpm (corepack)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # monorepo 单锁（pnpm-lock.yaml）一次装齐 shared（zod 契约包）+ frontend，
      # 与本地开发口径一致（pnpm 12，无需 --legacy-peer-deps）
      - name: Install workspace deps (shared + frontend)
        run: pnpm install --frozen-lockfile

      - name: Build (NEXT_EXPORT=1 → out/)
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_EXPORT: "1"

      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 7

  deploy-worker:
    name: Deploy Worker kaas (api + assets)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      # Python Workers 需要 pywrangler 打包 WASM 依赖（pylock.toml → python_modules/）
      # npx wrangler deploy 不会自动做这一步，会报 ModuleNotFoundError: No module named 'asyncpg'
      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # 为什么必须有这一步（2026-09 踩过的坑）：
      #   `backend/worker/.gitignore` 忽略 `src/kaas_common/`，镜像**不进仓库**；
      #   而本工作流此前只有 `pywrangler deploy`，没人跑同步脚本。
      #   后果：线上 bundle 里根本没有 kaas_common —— /health 显示
      #   shared.loaded=false，且报价引擎整包缺失（报价工位全部 503）。
      # 同步是幂等的、无人工判断的：把唯一源复制进 Worker 的 src/ 树。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Verify mirror is complete
        shell: pwsh
        run: ./scripts/sync-shared.ps1 -Check

      - name: Deploy to Cloudflare Workers
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      # 冒烟测试必须验证「Worker 真的活着」，而不是只看状态码：
      #   - /health 由 Worker 处理，必须返回 JSON（旧版只查状态码，被静态资产的
      #     SPA 回退返回的 index.html 200 骗过，Worker 挂掉也能"通过"）
      #   - /api/* 未带 token 必须返回 401（证明脚本启动 + 路由注册 + 鉴权生效）
      #   - 新版本切换存在数分钟窗口，故带重试
      - name: Smoke test (production)
        run: |
          set -uo pipefail
          API=https://api.kaas.powervoy.com
          WEB=https://kaas.powervoy.com

          echo "── 1) Worker 存活（/health 返回 JSON）──"
          ok=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 10 "$API/health" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "attempt $i: $body"; ok=1; break
            fi
            echo "attempt $i: not ready yet"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Worker /health 未返回 JSON（脚本可能启动失败）"; exit 1
          fi

          echo "── 2) API 路由与鉴权（未带 token 必须 401）──"
          # 报价工位相关的 4 条：若共享内核/引擎漏打包，这里会变成 503（而不是 401），
          # 从而在最前面就把「镜像没进包」这个事故拦住。
          for p in /api/v1/research/categories /api/v1/research/stats \
                   /api/v1/leads /api/v1/ai/tasks \
                   /api/v1/export-quote/products /api/v1/export-quote/rate-sets \
                   /api/v1/export-quote/quote-profiles /api/v1/quotes; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API$p")
            echo "$p -> $code"
            if [ "$code" != "401" ]; then
              echo "::error::$p 期望 401（路由存在且需鉴权），实际 $code"; exit 1
            fi
          done

          echo "── 2b) 共享内核已随包发布 ──"
          # /health 里的 shared.loaded 是「kaas_common 是否打进 bundle」的唯一直接探针。
          # 这条断言就是为上面那个坑加的：只查 status:ok 是发现不了的。
          health=$(curl -fsS --max-time 10 "$API/health" 2>/dev/null || true)
          if ! printf '%s' "$health" | grep -q '"loaded":true'; then
            echo "::error::共享内核未随包发布（/health shared.loaded != true）: $health"; exit 1
          fi
          echo "$health"

          echo "── 3) 前端页面（静态资产）──"
          for p in /research /leadgen /intel /outreach /settings/ai-providers; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$WEB$p")
            echo "$p -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$p 期望 200，实际 $code"; exit 1
            fi
          done

          echo "✅ smoke test passed"
