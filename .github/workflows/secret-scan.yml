name: secret:scan

# 2026-10-23：STRUCTURAL_DEBT.md §6.4「防再犯」的 CI 半边（pre-commit 半边在 .husky/pre-commit）。
# 为什么自己实现而不是 gitleaks：本机未安装；仓库是 public，少引一个第三方 Action/二进制就少一份
# 供应链面和额外权限；扫描范围固定为**当前树**（不扫 git 历史，避免 CI 超时；全历史扫描见 §6.2，另行授权）。
# 触发：push 到 main + 所有 pull_request（PR 是最需要拦的场景）+ 手动单跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: 当前树密钥扫描（零依赖 Node）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout（depth 1，只扫当前树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 扫描（命中即 fail；只报 文件:行 + 类型，值不回显）
        run: node scripts/check-secrets.mjs
