# 工单 A4/A6：最小 Python Worker 探针实验（E1 / E3）
#
# 为什么放在 CI：本机（Windows + CJK 路径）跑 pywrangler deploy 会在创建
# .venv-workers/pyodide-venv 时失败；CI 是 ubuntu，pywrangler 已被内核部署验证可用。
#
# 只手动触发，不参与日常门禁；它做的事：
#   1) 部署最小 probe worker（零业务依赖、无 routes、无 cron，仅 workers_dev）
#   2) 串行冷启动 10 次、并发冷启动 10 次（E3）
#   3) 采 tail 日志，汇总成 job summary（E1 判据：probe 是否也抛 init 异常）
#
# 判据（写进工单 §3A/A6）：
#   · probe 也出现 initPyInstance 异常 ⇒ 平台侧缺陷（与我们代码无关）
#   · 只有并发组异常 ⇒ 支持「并发 init 重入竞态」
#   · 两组都 0 异常 ⇒ 指向我们的依赖面/包体（转 E2 依赖二分）
name: pyinit-probe

on:
  workflow_dispatch:
    inputs:
      n:
        description: '每组请求数'
        required: false
        default: '10'
      keep_worker:
        description: '实验后是否保留 probe worker（true/false）'
        required: false
        default: 'true'
      target:
        description: 'probe = 最小零依赖探针（E1/E2 轻档）；kernelclone = 真实内核源码克隆（E2b）'
        required: false
        default: 'probe'

concurrency:
  group: pyinit-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Show toolchain
        run: |
          uv --version
          python3 --version

      # 诊断：CI 的 token 到底能不能「创建新 worker」？（pywrangler 会把 API 错误体吞掉）
      # 结果写进 summary，避免以后再靠猜。
      - name: Token capability diagnostic (create script)
        continue-on-error: true
        run: |
          echo 'export default { async fetch() { return new Response("ok"); } };' > /tmp/w.js
          printf '{"main_module":"w.js"}' > /tmp/meta.json
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kaas-token-probe-diag" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "w.js=@/tmp/w.js;type=application/javascript+module")
          echo "create-script http=$code"
          cat /tmp/resp.json || true
          {
            echo "### Token capability diagnostic"
            echo "- create-script http status: \`$code\`"
            echo '\`\`\`json'
            head -c 800 /tmp/resp.json || true
            echo ''
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      # E2b：把真实内核源码同步进克隆探针目录（不在仓库里存副本，避免与内核漂移）
      - name: Sync kernel source into kernelclone probe
        if: github.event.inputs.target == 'kernelclone'
        run: |
          rm -rf scripts/pyinit-probe-kernel/src
          cp -r backend/worker/src scripts/pyinit-probe-kernel/src
          cp backend/worker/pylock.toml scripts/pyinit-probe-kernel/ 2>/dev/null || true
          echo "synced $(find scripts/pyinit-probe-kernel/src -name '*.py' | wc -l) python files"

      - name: Pick probe dir
        id: dir
        run: |
          if [ "${{ github.event.inputs.target }}" = "kernelclone" ]; then
            echo "path=scripts/pyinit-probe-kernel" >> "$GITHUB_OUTPUT"
          else
            echo "path=scripts/pyinit-probe" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy minimal probe worker
        working-directory: ./${{ steps.dir.outputs.path }}
        run: |
          set -o pipefail
          uv run pywrangler deploy 2>&1 | tee deploy.log || {
            echo "::error::pywrangler deploy 失败，末尾日志："
            tail -60 deploy.log
            exit 1
          }

      - name: Resolve workers.dev hostname
        id: host
        run: |
          host=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$host" ]; then
            # pywrangler 输出可能不含 URL：用 API 查子域 + worker 名拼
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
            host="https://kaas-pyinit-probe.$sub.workers.dev"
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "probe host: $host"
          echo "=== deploy.log 末尾（含 workers.dev host 与体积信息）==="
          tail -25 deploy.log

      - name: Warm-up (single request)
        run: curl -s -o /dev/null -w 'warmup %{http_code}\n' "${{ steps.host.outputs.host }}"

      - name: E3 serial (10 sequential, 1s apart)
        working-directory: ./scripts/pyinit-probe
        run: |
          python3 pressure.py "${{ steps.host.outputs.host }}" --mode serial --n "${{ github.event.inputs.n }}" \
            | tee serial.json

      - name: E3 concurrent (10 at once)
        working-directory: ./scripts/pyinit-probe
        run: |
          python3 pressure.py "${{ steps.host.outputs.host }}" --mode concurrent --n "${{ github.event.inputs.n }}" \
            | tee concurrent.json

      - name: Tail probe worker during pressure (best effort)
        working-directory: ./scripts/pyinit-probe
        continue-on-error: true
        run: |
          (uv run npx --yes wrangler tail kaas-pyinit-probe --format json > tail.jsonl 2>tail.err &) || true
          sleep 2
          python3 pressure.py "${{ steps.host.outputs.host }}" --mode concurrent --n 20 > concurrent2.json || true
          sleep 3
          pkill -f "wrangler tail" || true
          echo "--- tail lines: $(wc -l < tail.jsonl 2>/dev/null || echo 0)"

      - name: Summarize
        if: always()
        working-directory: ./scripts/pyinit-probe
        run: |
          {
            echo "## pyinit-probe 结果（工单 A6）"
            echo ""
            echo "- probe host: ${{ steps.host.outputs.host }}"
            echo ""
            echo '### serial'
            echo '\`\`\`json'
            cat serial.json 2>/dev/null || echo '{}'
            echo '\`\`\`'
            echo '### concurrent'
            echo '\`\`\`json'
            cat concurrent.json 2>/dev/null || echo '{}'
            echo '\`\`\`'
            echo ""
            echo "### tail 里的异常签名（E1 判据）"
            echo '\`\`\`'
            grep -Eo '"message": *"[^"]{0,160}"' tail.jsonl 2>/dev/null | sort | uniq -c | sort -rn | head -20 || echo "（无 tail 数据）"
            echo '\`\`\`'
            echo ""
            echo "> 判据：probe 也抛 initPyInstance 异常 ⇒ 平台侧；只有并发组异常 ⇒ 并发重入；两组全绿 ⇒ 指向我们的依赖面（转 E2）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup probe worker (optional)
        if: always() && github.event.inputs.keep_worker != 'true'
        working-directory: ./scripts/pyinit-probe
        continue-on-error: true
        run: uv run npx --yes wrangler delete kaas-pyinit-probe --force

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinit-probe-results
          path: |
            scripts/pyinit-probe/serial.json
            scripts/pyinit-probe/concurrent.json
            scripts/pyinit-probe/concurrent2.json
            scripts/pyinit-probe/tail.jsonl
            scripts/pyinit-probe/deploy.log
          if-no-files-found: warn
