name: Frontend CI

on:
  # 手动触发：CI 排障单跑（与 backend-test 同口径）；本文件在自身 push paths 内，改动即自触发。
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/contracts/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/contracts/**'
      - '.github/workflows/frontend-ci.yml'

# 最小权限：本工作流只需要读代码（secrets 只在 job 内按 env 注入）
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm contracts:check

      - run: pnpm build
        env:
          # secret 只在 push（同仓、受信任）时注入；pull_request（含 fork）留空
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}

      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install chromium --with-deps

      - run: pnpm build

      - run: pnpm e2e
        env:
          NEXT_PUBLIC_API_MODE: mock
