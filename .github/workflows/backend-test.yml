name: backend:test

on:
  # 手动触发：CI 排障时避免「每次 push 都触发生产部署/重复测试」，
  # 可用 `POST /actions/workflows/backend-test.yml/dispatches {"ref":"main"}` 单跑测试。
  workflow_dispatch:

  push:
    paths:
      - 'backend/**'
      - 'scripts/route-parity.py'
      - 'scripts/route-parity-allowlist.txt'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/route-parity.py'
      - 'scripts/route-parity-allowlist.txt'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend/orchestrator
        run: uv sync

      # `test_trade_doc_render_fingerprint` 会断言 worker 镜像与共享内核逐字节一致；
      # `backend/worker/src/kaas_common/` 被 .gitignore 忽略 ⇒ runner 上必须先生成
      # （与 deploy.yml、worker-tests 同一步）。此前漏了这一步，unit-tests 恒红 1 条。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Run unit tests
        working-directory: ./backend/orchestrator
        run: uv run pytest -m unit --tb=short -q
        env:
          LLM_PROVIDER: stub
          KB_PROVIDER: stub

      # Worker 侧纯函数测试（产品提取 / 规格正则 / SSRF 防护 / 三态过滤）。
      # 只需 fastapi，故复用 orchestrator 的 venv；不依赖 Cloudflare runtime 与数据库。
      - name: Worker chain unit tests
        working-directory: ./backend/orchestrator
        run: uv run python ../worker/tests/test_product_extract.py

      # 路由对等：orchestrator 有、worker 没有的路由必须登记在
      # scripts/route-parity-allowlist.txt，否则线上会 404（历史多次踩坑）。
      # 只做静态解析，不需要装 Worker 依赖，秒级完成。
      - name: Route parity (orchestrator vs worker)
        run: uv run --no-project python scripts/route-parity.py

  worker-tests:
    name: "worker:tests（路由面 + 无 DB 行为测试）"
    runs-on: ubuntu-latest

    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      # Worker 目标运行时是 Pyodide，requires-python >= 3.13；与 orchestrator 分作业装。
      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      # worker 测试要 import main，而 main 依赖 src/kaas_common 镜像（被 .gitignore 忽略）。
      # 与 deploy.yml 同一步：镜像缺失时报价引擎整包不在，测试会真实失败而不是假绿。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Install worker deps
        working-directory: ./backend/worker
        run: uv sync

      # httpx2：starlette >= 1.0 的 TestClient 依赖它。不写进项目依赖，
      # 因为线上 bundle 用不到它（Cloudflare 对启动 CPU 有额度）。
      - name: Run worker tests
        working-directory: ./backend/worker
        run: uv run --frozen --with pytest --with httpx2 python -m pytest tests -q

  db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaas
          POSTGRES_PASSWORD: kaas_dev_pw
          POSTGRES_DB: kaas_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaas -d kaas_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_v2_test
      # 应用自身的 engine 也指向测试库：部分 e2e 用例走 async_client（不覆盖
      # get_db_session），会直接命中 app.db.session 的 engine。此前只用
      # TEST_DATABASE_URL 设置，导致 app 用默认 kaas:kaas_dev@localhost:5432/kaas_dev
      # 连库 ⇒ `password authentication failed for user "kaas"`。
      DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_v2_test
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend/orchestrator
        run: uv sync

      - name: Run DB tests
        working-directory: ./backend/orchestrator
        run: uv run pytest -m db --tb=short -q
        env:
          LLM_PROVIDER: stub
          KB_PROVIDER: stub

  # 真 Postgres 写入路径测试（task-8 / 路线 C 子集）。
  # worker 用裸 asyncpg 手写 SQL，假 DB 测不出「NOT NULL 且无默认值 / 漏列」这类
  # 500（注册、创建客户、手动报价都在线上踩过）。这里起真 PG，用 orchestrator 的
  # alembic 建 schema，再跑 backend/worker/tests/integration 的写库用例。
  worker-db-tests:
    name: "worker:integration（真 PG 写入路径）"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaas
          POSTGRES_PASSWORD: kaas_dev_pw
          POSTGRES_DB: kaas_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaas -d kaas_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_v2_test
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      # worker 测试要 import main，main 依赖被 .gitignore 忽略的 src/kaas_common 镜像。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Install worker deps
        working-directory: ./backend/worker
        run: uv sync

      # 集成用例的 schema 由 orchestrator 的 alembic 建；conftest 需要能
      # `import alembic, sqlalchemy, psycopg2` 的解释器（会自动发现
      # backend/orchestrator/.venv），故这里把 orchestrator 依赖也装上。
      - name: Install orchestrator deps（提供 alembic 迁移解释器）
        working-directory: ./backend/orchestrator
        run: uv sync

      - name: Run worker real-PG tests
        working-directory: ./backend/worker
        run: uv run --frozen --with pytest --with httpx2 python -m pytest tests -m integration -q
