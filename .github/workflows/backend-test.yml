name: backend:test

on:
  # 手动触发：CI 排障时避免「每次 push 都触发生产部署/重复测试」，
  # 可用 `POST /actions/workflows/backend-test.yml/dispatches {"ref":"main"}` 单跑测试。
  workflow_dispatch:

  push:
    paths:
      - 'backend/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'

jobs:
  unit-tests:
    name: "迁移/模型测试 + 静态门禁（S4 删壳后）"
    runs-on: ubuntu-latest

    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # S4 删壳后本包只剩 ORM 模型 + Alembic：迁移依赖在 optional-dependencies.migrations。
      - name: Install dependencies
        working-directory: ./backend/orchestrator
        run: uv sync --extra migrations

      # `test_trade_doc_render_fingerprint` 会断言 worker 镜像与共享内核逐字节一致；
      # `backend/worker/src/kaas_common/` 被 .gitignore 忽略 ⇒ runner 上必须先生成
      # （与 deploy.yml、worker-tests 同一步）。此前漏了这一步，unit-tests 恒红 1 条。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      # 方案 B 阶段二 S1 运行时依赖断言：共享内核 / Worker 运行时不得出现
      # sqlalchemy / alembic / greenlet / psycopg2（否则打不进 Worker 或冷启动超线）。
      - name: Runtime dependency gate
        run: uv run --no-project python scripts/check-runtime-deps.py

      - name: Run unit tests
        working-directory: ./backend/orchestrator
        run: uv run --extra migrations pytest -m unit --tb=short -q

      # 方案 B 阶段二 S2：schema 完备性 —— worker SQL 引用的表必须能被
      # 空库快径（metadata.create_all + stamp）创建，否则新环境必 500。
      - name: Schema coverage gate
        working-directory: ./backend/orchestrator
        run: uv run --extra migrations python ../../scripts/check-schema-coverage.py

      # 2026-10-19：表级门禁查不出**列/索引**漂移（本地冒烟实测：生产有 team_id、
      # 模型漏建 ⇒ 全新空库 export-quote/products 500）。用生产列快照做列级对比；
      # 生产独有表（历史遗留）登记在 scripts/schema-drift-allowlist.txt。
      - name: Schema column drift gate (vs production snapshot)
        working-directory: ./backend/orchestrator
        run: uv run --extra migrations python ../../scripts/check-schema-drift.py

      # 2026-10-21 结构性债门禁（STRUCTURAL_DEBT.md §4.1）：main.py 行数 / noqa:E402 /
      # except Exception / print() 阈值拦截新增债。已登记的 S-1/S-2 超阈值用 --allow-known 放行。
      - name: Structural debt gate
        working-directory: ./backend/orchestrator
        run: uv run --extra migrations python ../../scripts/check-structural-debt.py --allow-known

      # 说明：route-parity 已于 S4 退役（worker 是唯一后端，没有第二实现可比），
      # 脚本移入 scripts/archive/ 留档；S3 的 parity 测试是退役判据。

  worker-tests:
    name: "worker:tests（路由面 + 无 DB 行为测试）"
    runs-on: ubuntu-latest

    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      # Worker 目标运行时是 Pyodide，requires-python >= 3.13；与 orchestrator 分作业装。
      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      # worker 测试要 import main，而 main 依赖 src/kaas_common 镜像（被 .gitignore 忽略）。
      # 与 deploy.yml 同一步：镜像缺失时报价引擎整包不在，测试会真实失败而不是假绿。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Install worker deps
        working-directory: ./backend/worker
        run: uv sync

      # httpx2：starlette >= 1.0 的 TestClient 依赖它。不写进项目依赖，
      # 因为线上 bundle 用不到它（Cloudflare 对启动 CPU 有额度）。
      - name: Run worker tests
        working-directory: ./backend/worker
        run: uv run --frozen --with pytest --with httpx2 python -m pytest tests -q

      # S6-c：包体积门禁（pywrangler deploy --dry-run，不上传、不部署、不需要凭据）。
      # 冷启动基线文件 backend/worker/coldstart-baseline.json 缺失时打印 PENDING（不失败）。
      - name: Worker bundle size gate (S6-c)
        working-directory: ./backend/worker
        run: uv run python ../../scripts/check-worker-bundle.py

  # 真 Postgres 写入路径测试（task-8 / 路线 C 子集）。
  # worker 用裸 asyncpg 手写 SQL，假 DB 测不出「NOT NULL 且无默认值 / 漏列」这类
  # 500（注册、创建客户、手动报价都在线上踩过）。这里起真 PG，用 orchestrator 的
  # alembic 建 schema，再跑 backend/worker/tests/integration 的写库用例。
  worker-db-tests:
    name: "worker:integration（真 PG 写入路径）"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaas
          POSTGRES_PASSWORD: kaas_dev_pw
          POSTGRES_DB: kaas_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaas -d kaas_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_v2_test
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      # worker 测试要 import main，main 依赖被 .gitignore 忽略的 src/kaas_common 镜像。
      - name: Sync shared kernel + quote engine into worker
        shell: pwsh
        run: ./scripts/sync-shared.ps1

      - name: Install worker deps
        working-directory: ./backend/worker
        run: uv sync

      # 集成用例的 schema 由 orchestrator 的 alembic 建；conftest 需要能
      # `import alembic, sqlalchemy, psycopg2` 的解释器（会自动发现
      # backend/orchestrator/.venv），故这里把 orchestrator 依赖也装上。
      - name: Install orchestrator deps（提供 alembic 迁移解释器）
        working-directory: ./backend/orchestrator
        run: uv sync --extra migrations

      # 方案 B S2：空库快径（metadata.create_all + stamp）必须与 models 零漂移。
      # 用独立库 kaas_migtest，不干扰集成用例的 kaas_v2_test。
      - name: Create fresh DB for migration check
        run: PGPASSWORD=kaas_dev_pw psql -h localhost -U kaas -d postgres -c "CREATE DATABASE kaas_migtest"

      - name: Alembic upgrade head on empty DB (fast path)
        working-directory: ./backend/orchestrator
        env:
          DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_migtest
        run: uv run --extra migrations alembic upgrade head

      - name: Alembic drift check (metadata vs fast-path schema)
        working-directory: ./backend/orchestrator
        env:
          DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_migtest
        run: uv run --extra migrations alembic check

      # 最新迁移必须可回退：downgrade -1 → upgrade head 一轮。历史链整体降级
      # 有已知结构性断点（见 docs/MIGRATION_DOWNGRADE_AUDIT_2026-10-19.md 实测节），
      # 因此 CI 只保证「新增迁移可逆」，生产回滚仍以 Neon PITR / 分支快照为准。
      - name: Alembic downgrade/upgrade roundtrip (latest migration)
        working-directory: ./backend/orchestrator
        env:
          DATABASE_URL: postgresql+asyncpg://kaas:kaas_dev_pw@localhost:5432/kaas_migtest
        run: |
          uv run --extra migrations alembic downgrade -1
          uv run --extra migrations alembic upgrade head

      - name: Run worker real-PG tests
        working-directory: ./backend/worker
        run: uv run --frozen --with pytest --with httpx2 python -m pytest tests -m integration -q
