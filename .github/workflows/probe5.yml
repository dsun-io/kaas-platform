name: probe5
# 临时探针 5（2026-10-20）：验证 **step 级 secrets 引用**是否触发 dispatch 审批门禁。
# probe3（workflow 级 env 引用 secrets）dispatch 正常；本探针只在 step env 引用一个 secret。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: step with secret env
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -n "$NEON_API_KEY" ]; then echo "secret present (len=${#NEON_API_KEY})"; else echo "no secret"; fi
