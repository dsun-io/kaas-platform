packages:
  - 'frontend'
  - 'shared'
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  unrs-resolver: true
  workerd: true
overrides:
  'brace-expansion@1.x': 1.1.21
  'brace-expansion@2.x': 2.1.7
  'brace-expansion@5.x': 5.0.12
  'browserslist@4.x': 4.28.7
  'fast-uri@3.x': 3.1.7
  'form-data@4.x': 4.0.6
  'glob@10.x': 10.5.0
  'hono@4.x': 4.12.25
  'ip-address@10.x': 10.3.1
  'js-yaml@4.x': 4.3.2
  'nanoid@3.x': 3.3.19
  # 2026-10-20 升级后复扫：source-map-js <1.2.2（@vitest/coverage-v8→magicast）
  'source-map-js@1.x': 1.2.2
  # critical：proxy-addr < 2.0.8 有漏洞。它由 shadcn(CLI) → MCP SDK → express 拖进来。
  # 放在 pnpm-workspace.yaml 而不是 package.json 的 pnpm 字段 ——
  # pnpm v11 **不再读** package.json 里的 pnpm.overrides（会静默忽略），
  # 写在那里等于"看着有、其实不生效"。
  'proxy-addr@2.x': 2.0.8
  # 2026-10-20 升级后复扫：undici <7.29.1（jsdom 测试环境）
  'undici@7.x': 7.29.1

# 2026-10-20 用户裁决：放宽 pnpm 12 内置供应链冷却（默认拒装发布未满 24h 的包）。
# 理由：lockfile 已锁定日常安装版本，该策略只在"新增/升级依赖"一刻起作用；
# 且不放宽会被 10-20 升级引入的 ignore@7.0.13 卡死所有新设备的 pnpm install。
# 代价：未来 add/update 拉到发布不足 24h 的包时无冷却保护，接受此风险。
minimumReleaseAge: 0
