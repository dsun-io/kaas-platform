[project]
name = "kaas-orchestrator"
version = "0.1.0"
description = "Kaas V2 · 迁移与模型工具（方案 B S4：运行时已收口到 backend/worker/src）"
readme = "README.md"
requires-python = ">=3.11"
# S4 删壳后本包**不再承载运行时**：生产/本地运行的唯一 app 是 backend/worker/src/main.py。
# 这里只剩「ORM 模型 + Alembic 迁移链」，依赖因此拆成可选组：
#   uv sync --extra migrations     # 迁移/建表/空库快径（CI 的 schema 门禁与 deploy 的 migrate job）
#   uv sync                         # 只跑模型/纯函数测试（pytest）
dependencies = []

[project.optional-dependencies]
migrations = [
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # 仅测试用：test_files_s3 需要独立的 minio-py 实现交叉验证 SigV4 签名
    "minio>=7.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
# backend/ 入路径，供 import kaas_common（共享内核，G1 一份代码）
pythonpath = ["..", "."]
markers = [
    "unit: tests without external services",
    "db: tests requiring PostgreSQL",
    "integration: tests requiring running app/services",
    "slow: slow tests",
]
