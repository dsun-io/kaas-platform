# ─── Kaas v2 · 多租户静态配置 ───
# Phase 1: 静态 YAML 配置
# Phase 2+: 迁移至 PostgreSQL 动态加载
#
# 每个租户必须有唯一 tenant_id，对应 X-Tenant-Id header
# 所有 FastGPT dataset ID 由代码层拼接，AI 不参与范围决策（铁律1）

tenants:
  liankai:
    display_name: "联凯五金"
    enabled: true
    fastgpt:
      app_id: "test_app_id_liankai"
    product_categories:
      - 牛栏网
    db_schema: public
    feature_flags:
      use_v2: true
      sampling_rate: 0.1

  client_b:
    display_name: "客户 B"
    enabled: true
    fastgpt:
      app_id: "test_app_id_client_b"
    product_categories:
      - 石笼网
    db_schema: public
    feature_flags:
      use_v2: false
      sampling_rate: 0.1
