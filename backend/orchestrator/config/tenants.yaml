# ─── Kaas v2 · 多租户静态配置 ───
# Phase 1: 静态 YAML 配置
# Phase 2+: 迁移至 PostgreSQL 动态加载
#
# 每个租户必须有唯一 tenant_id，对应 X-Tenant-Id header
# 所有 FastGPT dataset ID 由代码层拼接，AI 不参与范围决策（铁律1）

tenants:
  liankai:
    display_name: "联凯五金"
    enabled: true
    fastgpt:
      app_id: "test_app_id_liankai"
      datasets:
        L1_共通: "dataset_L1_common"
        L1_牛栏网_行业: "dataset_L1_industry"
        L2_牛栏网_产品: "dataset_L2_product"
        L3_联凯_牛栏网: "dataset_L3_liankai"
    product_categories:
      - 牛栏网
    db_schema: public
    feature_flags:
      use_v2: true

  client_b:
    display_name: "客户 B"
    enabled: true
    fastgpt:
      app_id: "test_app_id_client_b"
      datasets:
        L1_共通: "dataset_L1_common"
    product_categories:
      - 石笼网
    db_schema: public
    feature_flags:
      use_v2: false
