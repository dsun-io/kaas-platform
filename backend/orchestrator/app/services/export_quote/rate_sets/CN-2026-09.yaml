# =============================================================================
# 税务档案 · 中国大陆 · 2026-09 生效
#
# 法定税率集中在这里，报价单只引用 code。政策变化时**新增**一份档案，
# 不要改这份 —— 这样历史报价才能逐分复现。
# =============================================================================
code: CN-2026-09
name: 中国大陆 · 2026年9月
country: CN
effective_from: 2026-09-01
effective_to: null            # null = 至今仍生效
source: "税率以财政部/税务总局及海关总署最新公告为准，本档案为业务基线，调整前请核对公告"

vat:
  levy_rate: 0.13             # 征税率（法定增值税率）  ← 13 调 12 时改这里
  output_rate_default: 0.13   # 默认销项税率
  output_rate_export: 0.00    # 出口零税率（出口业务用这个）
  output_rate_reduced: 0.09   # 低税率档（备用）

stamp_duty:
  rate: 0.05                  # 印花税率  ← 5% 调 6% 时改这里
  base: profit                # 计税基数：profit(加工利润) | cost | base_quote

export_rebate:
  # 出口退税率按产品 HS 编码确定。可退税比例 = 退税率 ÷ 征税率。
  #
  # ★ 请务必自行核对后填写。退税率填错的后果是整张报价单系统性偏低，
  #   所以本档案刻意不预填猜测值：未填写时查询会**明确报错**，由业务确认。
  #
  # 获取渠道（均需资质/鉴权，无法程序化免鉴权直连）：
  #   1. 国家税务总局「出口退税率文库」
  #   2. 中国国际贸易单一窗口（https://www.singlewindow.cn）— 需企业账号
  #   3. 各地电子税务局「我要查询 - 出口退税率查询」
  #   4. 订阅的商业 API —— 通过 settings 的 REBATE_RATE_API_URL 接入
  by_hs_code:
    "7314410000": null        # 牛栏网（热镀锌机织钢丝网）—— 待按 HS 编码核实后填入，如 0.10
    "7314490000": null        # 其他钢铁丝机织网 —— 待核实
    "7306309000": null        # 焊管（圆形截面焊接钢管）—— 待核实
  default: null               # 未收录时的兜底。null = 不猜、直接报错
  source: "待填写：以 HS 编码在税务总局退税率文库核实"

notes:
  - "报价单引用本档案编号，政策变化时新增一份档案而非修改本文件。"
  - "出口退税率未核实前，报价政策里的可退税比例请显式填写，不要使用 auto 模式。"
