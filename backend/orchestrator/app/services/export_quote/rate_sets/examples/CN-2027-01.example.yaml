# =============================================================================
# 税务档案 · 中国大陆 · 2027-01 起生效（政策调整**示例**，不参与自动解析）
#
# 这份档案存在的意义是演示版本化机制：假设国家下调征税率、上调印花税，
# 只需新增一份档案，然后新报价单引用它即可。引擎、产品类、接口代码
# **一行都不用改**，历史报价也不受影响。
#
# ⚠ 只作为示例放在 examples/ 子目录：`RateSetRegistry.from_dir()` 只扫描
#   rate_sets/ 顶层，不会加载本文件。这是刻意的 —— 示例档案里是**假税率**，
#   若被自动解析成"当期生效档案"，从 2027-01-01 起的报价会静默用错税率。
#
# 需要试跑时显式指定目录：
#   RateSetRegistry.from_dir("rate_sets/examples")   # 仅测试/演示
# =============================================================================
