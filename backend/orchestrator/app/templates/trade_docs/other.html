<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>$title</title>
<style>
/*__SHARED_STYLE__*/
</style>
</head>
<body>
<div class="doc">

  <div class="lh">$seller</div>

  <div class="title">
    <h1>$title</h1>
  </div>

  <table class="meta">
    <tr>
      <td class="k">Document No.</td><td class="v">$doc_no</td>
      <td class="k">Date</td><td class="v">$doc_date</td>
    </tr>
    <tr>
      <td class="k">Invoice No.</td><td class="v">$invoice_no</td>
      <td class="k">L/C No.</td><td class="v">$lc_no</td>
    </tr>
  </table>

  <div class="certify">$content</div>

  <table class="sign">
    <tr>
      <td style="width: 50%"></td>
      <td style="width: 50%">
        <div class="sign-box">
          <div class="rule"></div>
          <div class="cap">Authorised Signature &amp; Company Stamp</div>
          <div class="stamp-hint">For and on behalf of $seller_name</div>
        </div>
      </td>
    </tr>
  </table>

  <div class="foot">$footer_note</div>

</div>
</body>
</html>
