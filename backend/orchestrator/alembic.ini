# Alembic 配置文件 · Kaas v2
# 数据库迁移管理

[alembic]
# migrations 脚本位置
script_location = alembic

# 使用同步 URL（Alembic 自身不用 asyncpg）
# 实际值通过 env.py 中从 DATABASE_URL 转换获取
sqlalchemy.url = postgresql://kaas:kaas_dev@localhost:5432/kaas_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
