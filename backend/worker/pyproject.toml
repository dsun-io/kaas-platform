[project]
name = "kaas-intel-worker"
version = "0.1.0"
description = "KaaS Intel Workstation API on Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "asyncpg",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "httpx",
    "python-multipart",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
