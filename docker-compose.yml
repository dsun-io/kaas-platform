# ─── KaaS · Docker Compose · 本地开发环境 ───
# 包含: PostgreSQL + MinIO + Backend（2026-10-21 起移除 Redis —— 运行时无 redis 客户端，
# 历史归档 docs/archive/2026-10-20-p2-closeout/TECH_STACK_UPGRADE_2026-10-17.md 已判「删除或真接线二选一」）

services:
  # ─── PostgreSQL (L4 quotations + customer_capabilities + L0 events) ───
  postgres:
    image: postgres:16-alpine
    container_name: kaas-postgres
    environment:
      POSTGRES_USER: kaas
      POSTGRES_PASSWORD: kaas_dev
      POSTGRES_DB: kaas_dev
    ports:
      - "5432:5432"
    volumes:
      - kaas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaas -d kaas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (L0 events OSS 归档 · §3.7.4 约束3) ───
  # 2026-10-20 口径变更：官方 minio/minio 已从 Docker Hub 下架（拉取报 repository does not exist），
  # 改用第三方打包官方二进制的 elestio/minio（2026-10-20 实测：minio RELEASE.2025-09-07 + mc 均可用，
  # 健康检查 `mc ready local` 通过）。替代源：cleanstart/minio。恢复官方源：Docker Hub 上架时改回 minio/minio。
  minio:
    image: elestio/minio:latest
    container_name: kaas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    volumes:
      - kaas_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Backend（方案 B S4：单应用 = worker/src/local_run.py）───
  # 本地唯一后端就是生产同一份 worker app（uvicorn 起 main:app，DB 走 asyncpg）。
  # orchestrator 目录只剩 ORM 模型 + Alembic（建表用），不再是可运行服务。
  backend:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile.local
    container_name: kaas-backend
    ports:
      - "8000:8000"
    environment:
      # local_run 把 LOCAL_DATABASE_URL 注入 request.scope["env"].HYPERDRIVE
      - LOCAL_DATABASE_URL=postgresql://kaas:kaas_dev@postgres:5432/kaas_dev
      - JWT_SECRET=${JWT_SECRET:-local-dev-jwt-secret-at-least-32-chars!!}
      - ADMIN_SETUP_TOKEN=${ADMIN_SETUP_TOKEN:-local-setup-token}
      - LOCAL_RELOAD=${LOCAL_RELOAD:-1}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=kaas-events-archive
      - MINIO_SECURE=false
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      # 开发热重载：只挂 worker/src（含 sync-shared 生成的 kaas_common 镜像）
      - ./backend/worker/src:/app/src

volumes:
  kaas_pgdata:
  kaas_minio_data:
